<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botanica House</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/style.css">

</head>

<body id="vanta-bg">

<div class="container">

<div class="row justify-content-center align-items-center vh-100">

<div class="col-lg-10">

<div class="card login-card border-0 shadow-lg">

<div class="row g-0">

<!-- LEFT SIDE -->

<div class="col-md-6 branding-section">

<div class="branding-content">

<img src="./images/logo2.png"
class="logo-img mb-4"
alt="Botanica House Logo">

<p class="brand-description">

A calming indoor gardening and wellness platform
designed to bring peace, beauty, and balance into your home.

</p>

</div>

</div>

<!-- RIGHT SIDE -->

<div class="col-md-6 form-section">

<div class="form-container">

<h3 class="login-title">
Welcome Back
</h3>

<p class="login-text">
Sign in to continue your wellness journey.
</p>

<form id="loginForm">

<div class="mb-3">

<label class="form-label">
Email Address
</label>

<input type="email"
id="loginEmail"
class="form-control custom-input"
value="admin@botanica.com"
required>

</div>

<div class="mb-4">

<label class="form-label">
Password
</label>

<input type="password"
id="loginPassword"
class="form-control custom-input"
value="botanica123"
required>

</div>

<button type="submit"
class="btn login-btn w-100">

Login

</button>

<div class="demo-account mt-4">

<p class="demo-text mb-1">
<strong>Email:</strong> admin@botanica.com
</p>

<p class="demo-text">
<strong>Password:</strong> botanica123
</p>

</div>

<div class="text-center mt-4">

<span class="small-text">
Don't have an account?
</span>

<a href="register.html"
class="register-link">

Create Account

</a>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.topology.min.js"></script>

<script src="./js/auth.js"></script>

<script>
VANTA.TOPOLOGY({
  el: "#vanta-bg",
  mouseControls: true,
  touchControls: true,
  gyroControls: false,
  minHeight: 200.00,
  minWidth: 200.00,
  scale: 1.00,
  scaleMobile: 1.00,
  color: 0xabcc62,
  backgroundColor: 0x031a1a
})
</script>

</body>
</html>
