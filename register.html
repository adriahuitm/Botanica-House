<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Botanica House</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }

        .main-wrapper{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 40px;
            padding-bottom: 40px;
        }

        .register-card{
            border-radius: 30px;
            overflow: hidden;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(15px);
        }

        .branding-section{
            background: rgba(34, 49, 34, 0.55);
            color: white;
            padding: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .logo-img{
            width: 380px;
            max-width: 100%;
        }

        .brand-description{
            margin-top: 15px;
            font-size: 0.9rem;
            color: #f0f0f0;
            line-height: 1.7;
            font-weight: 300;
        }

        .form-section{
            background: rgba(255,255,255,0.95);
            padding: 60px;
        }

        .register-title{
            font-family: 'Playfair Display', serif;
            color: #2f4f2f;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .register-text{
            color: gray;
            margin-bottom: 30px;
        }

        .custom-input{
            height: 50px;
            border-radius: 12px;
            border: 1px solid #dcdcdc;
        }

        .custom-input:focus{
            box-shadow: none;
            border-color: #6b8e23;
        }

        .register-btn{
            background: #556b2f;
            color: white;
            height: 50px;
            border-radius: 12px;
            border: none;
            transition: 0.3s;
            font-weight: 500;
        }

        .register-btn:hover{
            background: #3f5221;
            color: white;
        }

        .login-link{
            color: #556b2f;
            text-decoration: none;
            font-weight: 500;
        }

        .small-text{
            color: gray;
        }

        @media(max-width:768px){
            body{
                overflow: auto;
            }

            .branding-section{
                padding: 40px;
            }

            .form-section{
                padding: 40px;
            }

            .logo-img{
                width: 260px;
            }
        }
    </style>
</head>

<body id="vanta-bg">

<div class="container main-wrapper">
<div class="row justify-content-center w-100">
<div class="col-lg-10">
<div class="card register-card border-0 shadow-lg">
<div class="row g-0">

<div class="col-md-6 branding-section">
    <div>
        <img src="images/logo.png" class="logo-img mb-4" alt="Botanica House Logo">

        <p class="brand-description">
            Create your botanical wellness journey and manage your indoor plants with peace, beauty, and balance.
        </p>
    </div>
</div>

<div class="col-md-6 form-section">

<h2 class="register-title">Create Account</h2>

<p class="register-text">
    Join Botanica House and begin your wellness journey.
</p>

<form id="registerForm">

<div class="mb-3">
    <label class="form-label">Full Name</label>
    <input type="text" id="fullname" class="form-control custom-input" required>
</div>

<div class="mb-3">
    <label class="form-label">Email Address</label>
    <input type="email" id="email" class="form-control custom-input" required>
</div>

<div class="mb-4">
    <label class="form-label">Password</label>
    <input type="password" id="password" class="form-control custom-input" required>
</div>

<button type="submit" class="btn register-btn w-100">
    Create Account
</button>

<div class="text-center mt-4">
    <span class="small-text">Already have an account?</span>
    <a href="index.html" class="login-link">Login</a>
</div>

</form>

</div>

</div>
</div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.1.9/p5.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.topology.min.js"></script>

<script src="js/auth.js"></script>

<script>
VANTA.TOPOLOGY({
  el: "#vanta-bg",
  mouseControls: true,
  touchControls: true,
  gyroControls: false,
  minHeight: 200.00,
  minWidth: 200.00,
  scale: 1.00,
  scaleMobile: 1.00,
  color: 0xabcc62,
  backgroundColor: 0x031a1a
})
</script>

</body>
</html>
